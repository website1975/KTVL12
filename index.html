<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduQuiz VN - Trắc nghiệm Online</title>
    <!-- Tailwind CSS (Bản CDN dùng nhanh, khi build Vite sẽ tự tối ưu sau nếu cấu hình PostCSS, nhưng để CDN này cho an toàn khi bạn chưa rành config) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#3b82f6',
              secondary: '#6366f1',
            }
          }
        }
      }
    </script>
    
    <!-- Katex CSS cho công thức toán học -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>

    <style>
      /* Thanh cuộn hiện đại, thanh thoát, dễ nhìn */
      ::-webkit-scrollbar {
        width: 7px;
        height: 7px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb {
        background: #94a3b8;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b;
      }
    </style>

    <!-- PDF.js CDN cho bộ bóc tách và cắt ảnh tự động từ file PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      if (window.pdfjsLib) {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }
    </script>
</head>
  <body class="bg-gray-50 text-gray-900 font-sans antialiased">
    <div id="root"></div>
    <!-- Entry point chuẩn cho Vite -->
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
